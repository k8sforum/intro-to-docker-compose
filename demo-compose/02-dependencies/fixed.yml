services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      # Host access for S3-compatible API and the MinIO console.
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      # Named volumes keep object data and MinIO config across container restarts.
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      # Compose can wait for the service to be responsive, not merely started.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mytravels-rabbitmq
    ports:
      # 5672 is AMQP. Other containers can use rabbitmq:5672 without this host publish.
      - "5672:5672"
      # Management UI for the browser.
      - "15672:15672"
      # Prometheus metrics endpoint, only needed if scraped from the host.
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      # Queue state and broker config are persisted separately.
      - mqdata:/var/lib/rabbitmq
      - mqconfig:/etc/rabbitmq
      # Host-file bind mount used to enable RabbitMQ plugins.
      # Fix: ./intro-to-k8s/1-dockerize/observability/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./missing-observability/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17.6-alpine
    container_name: mytravels-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host access for local database inspection tools.
      - "5432:5432"
    volumes:
      # Database data is kept in a named volume; init scripts are bind-mounted.
      - pgdata:/var/lib/postgresql/data
      # Fix: ./intro-to-k8s/scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - ./missing-script/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  mqdata:
    driver: local
  mqconfig:
    driver: local
  minio-data:
    driver: local
  minio-config:
    driver: local
